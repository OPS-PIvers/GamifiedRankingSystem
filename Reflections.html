<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythos Ascendant Reflections</title>
</head>
<body style="font-family: 'Georgia', serif; background-color: #f4f1ea; margin: 0; padding: 0; color: #001F3F;">

    <div style="max-width: 600px; margin: 20px auto; padding: 0; background-color: #FDFCF0; border-top: 8px solid #C5A028; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); border-radius: 4px; overflow: hidden;">
        <!-- Header Section -->
        <div style="padding: 32px 20px; text-align: center; border-bottom: 1px solid rgba(197, 160, 40, 0.3);">
            <img src="<?= mainLogoUrl ?>" alt="Mythos Ascendant Logo"
                 style="width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto;">
            <h1 style="font-family: 'Cinzel', serif; font-size: 26px; font-weight: 900; color: #001F3F; margin: 20px 0 0 0; text-transform: uppercase; letter-spacing: 2px;"><?= heading ?></h1>
            <p style="font-size: 15px; color: #001F3F; margin: 12px 0 0 0; line-height: 1.5;"><?= intro ?></p>
        </div>

        <!-- One card per reflection -->
        <div style="padding: 24px 24px 8px 24px;">
            <? for (var i = 0; i < entries.length; i++) { var entry = entries[i]; ?>
                <div style="margin-bottom: 20px; padding: 18px 20px; background-color: #ffffff; border: 1px solid rgba(197, 160, 40, 0.5); border-left: 4px solid #C5A028; border-radius: 2px;">
                    <p style="font-size: 12px; color: #7A6118; margin: 0; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">
                        <?= entry.mediaType ?> &middot; Submitted <?= entry.submitted ?>
                    </p>
                    <h2 style="font-family: 'Cinzel', serif; font-size: 20px; color: #001F3F; margin: 6px 0 14px 0;"><?= entry.mediaTitle ?></h2>

                    <p style="font-size: 12px; color: #7A6118; margin: 0 0 2px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">When you experienced it</p>
                    <p style="font-size: 15px; margin: 0 0 14px 0; line-height: 1.5; white-space: pre-wrap;"><?= entry.reflectionDate ?></p>

                    <p style="font-size: 12px; color: #7A6118; margin: 0 0 2px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Mythological connection</p>
                    <p style="font-size: 15px; margin: 0 0 14px 0; line-height: 1.5; white-space: pre-wrap;"><?= entry.reflectionConnection ?></p>

                    <p style="font-size: 12px; color: #7A6118; margin: 0 0 2px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Analysis</p>
                    <p style="font-size: 15px; margin: 0 0 14px 0; line-height: 1.5; white-space: pre-wrap;"><?= entry.reflectionAnalysis ?></p>

                    <p style="font-size: 13px; color: #3D4F63; margin: 0;"><?= entry.status ?></p>
                </div>
            <? } ?>
        </div>

        <? if (showTotals) { ?>
        <!-- Footer Stats Section -->
        <div style="background-color: #001F3F; padding: 25px; text-align: center;">
            <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td width="50%" style="text-align: right; padding-right: 25px; border-right: 1px solid rgba(197, 160, 40, 0.5);">
                        <span style="font-size: 12px; color: #D9B850; text-transform: uppercase; letter-spacing: 1px;">Glory Points</span><br>
                        <span style="font-size: 22px; color: #C5A028; font-weight: bold;"><?= totalPoints ?></span>
                    </td>
                    <td width="50%" style="text-align: left; padding-left: 25px;">
                        <span style="font-size: 12px; color: #D9B850; text-transform: uppercase; letter-spacing: 1px;">Heroic Title</span><br>
                        <span style="font-size: 18px; color: #FDFCF0; font-weight: bold; font-family: 'Cinzel', serif;"><?= title ?></span>
                    </td>
                </tr>
            </table>
        </div>
        <? } ?>

        <div style="padding: 20px; text-align: center; background-color: #f4f1ea; border-top: 1px solid rgba(0, 31, 63, 0.1);">
            <p style="font-size: 12px; color: #3D4F63; margin: 0; font-style: italic;">
                Keep this email to look back on when you discuss your myths in class.<br>
                &copy; 2026 Mythos Ascendant Gamified Ranking System.
            </p>
        </div>
    </div>

</body>
</html>
